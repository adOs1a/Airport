<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АРМ Диспетчера / FIDS Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-body {
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .auth-card h1 {
      color: #ffcc00;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .auth-card p.subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: #c9d1d9;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    .form-input:focus, .form-select:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #2ea043;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-cancel {
      width: 100%;
      padding: 10px;
      background-color: #30363d;
      color: #c9d1d9;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: none;
    }

    .btn-cancel:hover {
      background-color: #484f58;
      color: #ffffff;
    }

    .error-msg {
      color: #f85149;
      background-color: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      display: none;
    }

    .dashboard-wrapper {
      display: none;
      padding: 24px;
      max-width: 1350px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .dash-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px 24px;
      margin-bottom: 24px;
    }

    .dash-topbar h2 {
      color: #ffcc00;
      font-size: 1.3rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-logout {
      background-color: #da3633;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-logout:hover {
      background-color: #b62324;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    @media (max-width: 992px) {
      .dash-grid {
        grid-template-columns: 1fr;
      }
    }

    .dash-panel {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
    }

    .dash-panel h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 16px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }

    .btn-action-small {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      margin-right: 5px;
    }

    .btn-edit {
      background-color: rgba(88, 166, 255, 0.2);
      color: #58a6ff;
    }

    .btn-edit:hover {
      background-color: #1f6feb;
      color: #ffffff;
    }

    .btn-delete {
      background-color: rgba(248, 81, 73, 0.2);
      color: #f85149;
    }

    .btn-delete:hover {
      background-color: #da3633;
      color: #ffffff;
    }
  </style>
</head>
<body class="admin-body">

  <!-- 1. ФОРМА ВХОДА -->
  <div class="auth-wrapper" id="authSection">
    <div class="auth-card">
      <h1>🛫 Вход в АРМ FIDS</h1>
      <p class="subtitle">Автоматизированное рабочее место диспетчера</p>

      <div class="error-msg" id="authError">Неверный логин или пароль</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Логин диспетчера</label>
          <input type="text" id="username" class="form-input" placeholder="Введите логин" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit" id="btnLogin">Войти в систему</button>
      </form>
    </div>
  </div>

  <!-- 2. ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <div class="dashboard-wrapper" id="dashSection">
    <header class="dash-topbar">
      <h2>🛠️ Панель управления табло FIDS</h2>
      <div>
        <span id="userBadge" style="margin-right: 15px; color: #8b949e; font-weight: 600;">Диспетчер: admin</span>
        <a href="index.html" style="color: #58a6ff; text-decoration: none; margin-right: 16px; font-weight: 600;">На главную</a>
        <button class="btn-logout" onclick="handleLogout()">Выйти</button>
      </div>
    </header>

    <div class="dash-grid">
      <section class="dash-panel">
        <h3 id="formTitle">Добавить рейс</h3>
        <form id="flightForm" onsubmit="handleSaveFlight(event)">
          <input type="hidden" id="flightId" value="">

          <div class="form-group">
            <label>Тип рейса</label>
            <select id="flightType" class="form-select">
              <option value="departure">Вылет</option>
              <option value="arrival">Прилёт</option>
            </select>
          </div>

          <div class="form-group">
            <label>Номер рейса</label>
            <input type="text" id="flightNum" class="form-input" placeholder="SU 102" required>
          </div>

          <div class="form-group">
            <label>Авиакомпания</label>
            <select id="flightAirline" class="form-select">
              <option value="Аэрофлот">Аэрофлот</option>
              <option value="S7 Airlines">S7 Airlines</option>
              <option value="Победа">Победа</option>
              <option value="Уральские Авиалинии">Уральские Авиалинии</option>
              <option value="ЮТэйр">ЮТэйр</option>
            </select>
          </div>

          <div class="form-group">
            <label>Город / Назначение</label>
            <input type="text" id="flightCity" class="form-input" placeholder="Москва (SVO)" required>
          </div>

          <div class="form-group">
            <label>Время рейса (ЧЧ:ММ)</label>
            <input type="text" id="flightTime" class="form-input" placeholder="14:30" required>
          </div>

          <div class="form-group">
            <label>Сектор</label>
            <input type="text" id="flightSector" class="form-input" placeholder="A, B или C" value="A">
          </div>

          <div class="form-group">
            <label>Диапазон стоек</label>
            <input type="text" id="flightDesks" class="form-input" placeholder="11–18" value="11–18">
          </div>

          <div class="form-group">
            <label>Время регистрации</label>
            <input type="text" id="flightCheckinTime" class="form-input" placeholder="12:00–13:50" value="12:00–13:50">
          </div>

          <div class="form-group">
            <label>Выход (Gate) / Зона выдачи</label>
            <input type="text" id="flightGate" class="form-input" placeholder="A02 или Лента 1" value="A01">
          </div>

          <div class="form-group">
            <label>Статус</label>
            <select id="flightStatus" class="form-select">
              <option value="По расписанию">По расписанию</option>
              <option value="Регистрация">Регистрация</option>
              <option value="Посадка">Посадка</option>
              <option value="Посадка окончена">Посадка окончена</option>
              <option value="Вылетел">Вылетел</option>
              <option value="Задержан">Задержан</option>
              <option value="Ожидается">Ожидается (Прилёт)</option>
              <option value="Совершил посадку">Совершил посадку (Прилёт)</option>
            </select>
          </div>

          <button type="submit" class="btn-submit" id="btnSaveFlight">Добавить рейс</button>
          <button type="button" class="btn-cancel" id="btnCancelEdit" onclick="resetFlightForm()">Отменить редактирование</button>
        </form>

        <hr style="border: none; border-top: 1px solid #30363d; margin: 24px 0;">

        <h3>Управление бегущей строкой</h3>
        <form onsubmit="handleSaveTicker(event)">
          <div class="form-group">
            <label>Информационное сообщение</label>
            <textarea id="tickerInput" class="form-input" rows="3" style="resize: vertical;"></textarea>
          </div>
          <button type="submit" class="btn-submit" style="background-color: #1f6feb;">Обновить строку</button>
        </form>
      </section>

      <section class="dash-panel">
        <h3>Текущие рейсы в базе данных</h3>
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 2px solid #30363d; text-align: left;">
                <th style="padding: 10px;">Тип</th>
                <th style="padding: 10px;">Время</th>
                <th style="padding: 10px;">Рейс</th>
                <th style="padding: 10px;">Город</th>
                <th style="padding: 10px;">Стойки / Выход</th>
                <th style="padding: 10px;">Статус</th>
                <th style="padding: 10px; text-align: center;">Действия</th>
              </tr>
            </thead>
            <tbody id="adminFlightsTableBody">
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="store.js"></script>
  <script>
    const DISPATCHER_USERS = {
      'dispatcher1': '71f46d1bf562479e023ca6eecda9eb22ad37efbe0ca59c0047fb5fa896089308',
      'admin': 'b43b6641e72159fa6e5eb60490b6d9e03d4ee1e12790757c3e5362bf89e7c3ea'
    };

    async function calcHash(text) {
      if (window.crypto && crypto.subtle) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text + "_salt_airport_2024");
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return null;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const sessionUser = sessionStorage.getItem(STORAGE_KEY_AUTH);
      if (sessionUser) {
        showDashboard(sessionUser);
      }

      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          const u = document.getElementById('username').value.trim();
          const p = document.getElementById('password').value.trim();
          const err = document.getElementById('authError');

          const isDirectMatch = (u === 'dispatcher1' && p === 'fly123') || (u === 'admin' && p === 'admin123');
          
          let isHashMatch = false;
          try {
            const h = await calcHash(p);
            if (DISPATCHER_USERS[u] && DISPATCHER_USERS[u] === h) {
              isHashMatch = true;
            }
          } catch (ex) {
            console.error('Crypto error:', ex);
          }

          if (isDirectMatch || isHashMatch) {
            err.style.display = 'none';
            sessionStorage.setItem(STORAGE_KEY_AUTH, u);
            showDashboard(u);
          } else {
            err.style.display = 'block';
          }
        });
      }
    });

    function handleLogout() {
      sessionStorage.removeItem(STORAGE_KEY_AUTH);
      document.getElementById('authSection').style.display = 'flex';
      document.getElementById('dashSection').style.display = 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    function showDashboard(user) {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('dashSection').style.display = 'block';
      document.getElementById('userBadge').textContent = 'Диспетчер: ' + user;
      const tickerInp = document.getElementById('tickerInput');
      if (tickerInp && typeof getTickerText === 'function') {
        tickerInp.value = getTickerText();
      }
      renderAdminTable();
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminFlightsTableBody');
      if (!tbody || typeof getFlights !== 'function') return;
      const flights = getFlights();
      tbody.innerHTML = '';

      flights.forEach(f => {
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #21262d';
        const isDep = typeof isDepartureType === 'function' ? isDepartureType(f.type) : (f.type === 'departure');
        const typeLabel = isDep ? '🛫 Вылет' : '🛬 Прилёт';
        const subInfo = isDep ? (f.checkinDesks || '-') : (f.gate || '-');

        tr.innerHTML = `
          <td style="padding: 10px;">${typeLabel}</td>
          <td style="padding: 10px; font-weight: 700;">${f.time || '--:--'}</td>
          <td style="padding: 10px; color: #ffcc00; font-weight: 700;">${f.flight || ''}</td>
          <td style="padding: 10px;">${f.city || ''}</td>
          <td style="padding: 10px;">${subInfo}</td>
          <td style="padding: 10px;"><span class="status-badge ${f.statusClass || ''}">${f.status || ''}</span></td>
          <td style="padding: 10px; text-align: center; white-space: nowrap;">
            <button class="btn-action-small btn-edit" onclick="handleEditFlight('${f.id}')">Изменить</button>
            <button class="btn-action-small btn-delete" onclick="handleDeleteFlight('${f.id}')">Удалить</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function handleEditFlight(id) {
      const flights = getFlights();
      const flight = flights.find(f => f.id === id);
      if (!flight) return;

      document.getElementById('flightId').value = flight.id;
      document.getElementById('flightType').value = flight.type;
      document.getElementById('flightNum').value = flight.flight;
      document.getElementById('flightAirline').value = flight.airline;
      document.getElementById('flightCity').value = flight.city;
      document.getElementById('flightTime').value = flight.time;
      document.getElementById('flightSector').value = flight.sector || 'A';
      document.getElementById('flightDesks').value = flight.checkinDesks || '11–18';
      document.getElementById('flightCheckinTime').value = flight.checkinTime || '12:00–13:50';
      document.getElementById('flightGate').value = flight.gate || 'A01';
      document.getElementById('flightStatus').value = flight.status;

      document.getElementById('formTitle').textContent = 'Редактировать рейс ' + flight.flight;
      document.getElementById('btnSaveFlight').textContent = 'Сохранить изменения';
      document.getElementById('btnSaveFlight').style.backgroundColor = '#1f6feb';
      document.getElementById('btnCancelEdit').style.display = 'block';

      document.getElementById('flightForm').scrollIntoView({ behavior: 'smooth' });
    }

    function resetFlightForm() {
      document.getElementById('flightId').value = '';
      document.getElementById('flightForm').reset();
      document.getElementById('formTitle').textContent = 'Добавить рейс';
      document.getElementById('btnSaveFlight').textContent = 'Добавить рейс';
      document.getElementById('btnSaveFlight').style.backgroundColor = '#238636';
      document.getElementById('btnCancelEdit').style.display = 'none';
    }

    function handleSaveFlight(e) {
      e.preventDefault();
      const editId = document.getElementById('flightId').value;
      const status = document.getElementById('flightStatus').value;
      
      let statusClass = 'status-scheduled';
      if (status.includes('Посадка окончена')) statusClass = 'status-closed';
      else if (status.includes('Посадка')) statusClass = 'status-boarding';
      else if (status.includes('Задержан')) statusClass = 'status-delayed';
      else if (status.includes('Вылетел') || status.includes('посадку')) statusClass = 'status-departed';
      else if (status.includes('Регистрация')) statusClass = 'status-checkin';

      const flightData = {
        type: document.getElementById('flightType').value,
        flight: document.getElementById('flightNum').value.trim(),
        airline: document.getElementById('flightAirline').value,
        city: document.getElementById('flightCity').value.trim(),
        time: document.getElementById('flightTime').value.trim(),
        sector: document.getElementById('flightSector').value.trim(),
        checkinDesks: document.getElementById('flightDesks').value.trim(),
        checkinTime: document.getElementById('flightCheckinTime').value.trim(),
        gate: document.getElementById('flightGate').value.trim(),
        status: status,
        statusClass: statusClass,
        auto: !status.includes('Задержан')
      };

      let flights = getFlights();

      if (editId) {
        flights = flights.map(f => f.id === editId ? { ...f, ...flightData } : f);
        alert('Рейс успешно обновлен!');
      } else {
        flightData.id = 'f_' + Date.now();
        flights.push(flightData);
        alert('Рейс успешно добавлен!');
      }

      saveFlights(flights);
      renderAdminTable();
      resetFlightForm();
    }

    function handleDeleteFlight(id) {
      if (!confirm('Вы действительно хотите удалить этот рейс?')) return;
      let flights = getFlights();
      flights = flights.filter(f => f.id !== id);
      saveFlights(flights);
      renderAdminTable();
    }

    function handleSaveTicker(e) {
      e.preventDefault();
      const txt = document.getElementById('tickerInput').value.trim();
      if (txt) {
        saveTickerText(txt);
        alert('Бегущая строка обновлена на всех экранах табло!');
      }
    }
  </script>
</body>
</html>
