<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Табло прилета | Терминал 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board-fullscreen">
    <div class="board-top">
      <div class="board-title">🛬 ПРИЛЕТ / ARRIVALS</div>
      <div class="board-clock" id="clock">00:00:00</div>
    </div>
    <table class="fids-table">
      <thead>
        <tr>
          <th>Время</th>
          <th>Рейс</th>
          <th>Откуда</th>
          <th>Авиакомпания</th>
          <th>Зона выдачи багажа</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="flights-list"></tbody>
    </table>
  </div>

  <!-- Бегущая информационная строка -->
  <div class="ticker-wrap">
    <div class="ticker-title">ИНФОРМАЦИЯ</div>
    <div class="ticker-content" id="ticker-text">Загрузка...</div>
  </div>

  <script src="store.js"></script>
  <script>
    startClock('clock');

    function updateTicker() {
      document.getElementById('ticker-text').textContent = getTickerText();
    }

    function renderArrivals() {
      const tbody = document.getElementById('flights-list');
      tbody.innerHTML = '';
      const arrivals = getFlights().filter(f => f.type === 'arrival');

      arrivals.forEach(f => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${f.time}</td>
          <td><strong>${f.flight}</strong></td>
          <td>${f.city}</td>
          <td>
            <div class="airline-cell">
              ${getAirlineBadge(f.airline)}
              <span>${f.airline}</span>
            </div>
          </td>
          <td>${f.gate}</td>
          <td class="${f.statusClass}">${f.status}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    renderArrivals();
    updateTicker();

    // Запуск автоматического движка смены статусов
    runStatusEngine(renderArrivals);

    // Реакция на изменения
    window.addEventListener('storage', (e) => {
      if (e.key === 'fids_flights_data') renderArrivals();
      if (e.key === 'fids_ticker_text') updateTicker();
    });
  </script>
</body>
</html>
